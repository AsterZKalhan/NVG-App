name: Deploy SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compiler le CSS (Tailwind)
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i src/tailwind.css -o tailwind.css --minify

      - name: Minifier les scripts
        run: |
          npm install -g terser@5
          for f in *.js; do
            case "$f" in
              *.min.js|sw.js) continue ;;
            esac
            terser "$f" -c -m --comments false -o "$f.tmp"
            mv "$f.tmp" "$f"
            node --check "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install paramiko

      - run: python .github/scripts/deploy_sftp.py
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

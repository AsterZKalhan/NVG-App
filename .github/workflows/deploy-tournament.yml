name: Deploy tournoi SFTP

on:
  push:
    branches: [main]
    paths:
      - "tournoi-site/**"
      - ".github/scripts/deploy_tournament_sftp.py"
      - ".github/workflows/deploy-tournament.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compiler le CSS (Tailwind)
        run: npx --yes tailwindcss@3.4.17 -c tournoi-site/tailwind.config.js -i tournoi-site/src/tailwind.css -o tournoi-site/tailwind.css --minify

      - name: Minifier les scripts du site
        run: |
          npm install -g terser@5
          terser tournoi-site/tournament.js -c -m --comments false -o tournoi-site/tournament.js.tmp
          mv tournoi-site/tournament.js.tmp tournoi-site/tournament.js
          node --check tournoi-site/tournament.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install paramiko

      - run: python .github/scripts/deploy_tournament_sftp.py
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Test session partagée</title></head>
<body>
<pre id="out">…</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-shared.js"></script>
<script>
(async function () {
  const URL = 'https://fxewefwwpowhnacrxfdp.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4ZXdlZnd3cG93aG5hY3J4ZmRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTQ5NTksImV4cCI6MjEwODc3MDk1OX0.nDlHFbpzBipH3Po61OkzNdAfPnCRaCNOwa1aN6ap8qk';
  const params = new URLSearchParams(location.search);
  const action = params.get('action') || 'read';
  const lines = ['host=' + location.host, 'action=' + action];
  try {
    const sb = supabase.createClient(URL, KEY, { auth: { storage: window.NVG_SHARED_AUTH_STORAGE } });
    if (action === 'signin') {
      const { data, error } = await sb.auth.signInWithPassword({ email: params.get('email'), password: params.get('password') });
      lines.push('signin=' + (error ? 'ERREUR ' + error.message : 'ok ' + data.user.email));
    } else if (action === 'signout') {
      const { error } = await sb.auth.signOut();
      lines.push('signout=' + (error ? 'ERREUR ' + error.message : 'ok'));
    }
    const { data: { session } } = await sb.auth.getSession();
    lines.push('session=' + (session && session.user ? session.user.email : 'aucune'));
    lines.push('cookies=' + document.cookie.split('; ').filter(c => c.indexOf('nvg_') === 0).map(c => c.split('=')[0]).join(','));
  } catch (err) {
    lines.push('EXCEPTION=' + err.message);
  }
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body></html>
